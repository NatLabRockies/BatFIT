name: batfit-CI

on:
   push:
     branches: [main]
     paths-ignore:
      - '*.md'
      - 'README*'
      - 'LICENSE'
      - 'docs/**'

   pull_request:
     branches: [main]
     paths-ignore:
      - '*.md'
      - 'README*'
      - 'LICENSE'
      - 'docs/**'

jobs:
  Lint:
    name: Lint (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        os: ['ubuntu-latest']
    defaults:
      run:
        working-directory: ${{github.workspace}}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' 

      - name: Cache Nox
        uses: actions/cache@v4
        with:
          path: .nox
          key: ${{ runner.os }}-lint-nox-${{ hashFiles('noxfile.py') }}

      - name: Install nox
        run: pip install nox

      - name: Code format
        run: nox -s linter

      - name: Spell check
        run: nox -s codespell

  Unit-Test:
    name: (Unit-Test ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        os: ['ubuntu-latest', 'macos-latest']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache Nox
        uses: actions/cache@v4
        with:
          path: .nox
          key: ${{ runner.os }}-test-nox-${{ hashFiles('noxfile.py', 'setup.py') }}

      - name: Install batfit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nox
          pip install -e .[tests]

      - name: Pytest
        env:
          MPLBACKEND: Agg
        run: nox -s tests -- no-reports

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          MPLBACKEND: Agg
        run: nox -s tests -- no-cleanup

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml
          fail_ci_if_error: false

  Regression-Test:
    name: (Regression-Test ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        os: ['ubuntu-latest', 'macos-latest']
        mpi: ['openmpi']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: ${{ matrix.mpi }}

      - name: Install batfit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nox
          pip install .[tests]

      - name: Generate data in parallel with MPI
        env:
          MPLBACKEND: Agg
        run: |
          cd scripts/reg_tests/1.gen_data
          bash run.sh
          if [ ! -f "data_spm_discharge/sols.pkl" ]; then
            exit 1
          fi
          if [ ! -f "data_spm_discharge/data_split.npz" ]; then
            exit 1
          fi
          cd ../../../
      - name: Train surrogate
        run: |
          cd scripts/reg_tests/2.surrogate
          bash run.sh
          if [ ! -f "spm_discharge_surrogate/models/model_final.pt" ]; then
            exit 1
          fi
          if [ ! -f "spm_discharge_surrogate/models/Figures/surr_preds.pdf" ]; then
            exit 2
          fi
          cd ../../../
      - name: Do MCMC with the surrogate
        run: |
          cd scripts/reg_tests/3.surrogate_mcmc
          bash run.sh
          if [ ! -f "spm_discharge_surrogate_mcmc/models/samples.npz" ]; then
            exit 1
          fi 
          if [ ! -f "spm_discharge_surrogate_mcmc/models/post.txt" ]; then
            exit 2
          fi 
          cd ../../../
      - name: NPE training (Gaussian)
        run: |
          cd scripts/reg_tests/4.npe_gaussian
          bash run.sh
          if [ ! -f "models/post_val.txt" ]; then
            exit 1
          fi
          cd ../../../
      - name: NPE training (FM)
        run: |
          cd scripts/reg_tests/5.npe_fm
          bash run.sh
          if [ ! -f "models/post_val.txt" ]; then
            exit 1
          fi
          cd ../../../
