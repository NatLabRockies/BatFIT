# DATA
cyc_mode: chargecc
data_path: ../1.gen_data/data_p2d_nochirp
n_param_pred: 6
n_points: 128                # HPC: 512 (must match gen -n_points_reduce)
noise_factor: 1.0
scaler_path: ../1.gen_data/data_p2d_nochirp/scaler_X.pkl
sim_config: p2d_nochirp.yaml
target_mode: phi

# ARCH
num_channels: 64             # HPC: 512
num_convs: 2                 # HPC: 6
num_fc_hidden: 1
num_fc_units: 256            # HPC: 2048
num_fc_gamma_mu_hidden: 2
num_fc_gamma_mu_units: 256   # HPC: 2048

# TRAIN
batch_size: 32               # HPC: 2048
epochs: 20                   # HPC: 700
lr: 0.0001
models_dir: models_p2d_nochirp
# Path to a checkpoint to restart from (weights only); null = from scratch.
restart_from: null
