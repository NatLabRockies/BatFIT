# DATA
cyc_mode: chirp
data_path: ../1.gen_data/data_spm_chirp
n_param_pred: 6
n_prot_params: 3
n_points: 256                # HPC: 2048 (must match gen -n_points_reduce)
noise_factor: 1.0
sim_config: spm_chirp.yaml
target_mode: phi

# ARCH
# margin of the mu head beyond the [0, 1] parameter bounds
param_margin: 0.05
num_channels: 64             # HPC: 512
num_convs: 2                 # HPC: 8
num_fc_hidden: 1
num_fc_units: 256            # HPC: 2048
num_fc_prot_hidden: 1
num_fc_prot_units: 256       # HPC: 64
num_fc_gamma_mu_hidden: 2
num_fc_gamma_mu_units: 256   # HPC: 2048

# TRAIN
batch_size: 32               # HPC: 1536
epochs: 20                   # HPC: 500
lr: 0.0001
models_dir: models_spm_chirp
# Path to a checkpoint to restart from (weights only); null = from scratch.
restart_from: null
