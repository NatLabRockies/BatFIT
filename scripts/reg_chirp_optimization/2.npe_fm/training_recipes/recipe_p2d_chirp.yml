# DATA
cyc_mode: chirp
data_path: ../1.gen_data/data_p2d_chirp
n_points: 256                # HPC: 2048 (must match gen -n_points_reduce)
noise_factor: 1.0
sim_config: p2d_chirp.yaml
target_mode: phi

# ARCH - CNN encoder
num_channels: 64             # HPC: 512
num_convs: 2                 # HPC: 8
num_fc_hidden: 1
num_fc_units: 256            # HPC: 2048
num_fc_prot_hidden: 1
num_fc_prot_units: 64        # HPC: 64

# ARCH - velocity field MLP
num_vf_hidden: 2             # HPC: 4
num_vf_units: 256            # HPC: 2048

# TRAIN
batch_size: 32               # HPC: 1536
epochs: 20                   # HPC: 500
lr: 0.0001
models_dir: models_p2d_chirp
# Path to a checkpoint to restart from (weights only); null = from scratch.
restart_from: null

# FM SPECIFIC
use_prior_matching: false

# TEST
n_samples: 1000
n_ode_steps: 100
