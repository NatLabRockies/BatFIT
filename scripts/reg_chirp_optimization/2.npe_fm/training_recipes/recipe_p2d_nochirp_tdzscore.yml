# DATA
cyc_mode: chargecc
data_path: ../1.gen_data/data_p2d_nochirp
n_points: 128                # HPC: 512 (must match gen -n_points_reduce)
noise_factor: 1.0
sim_config: p2d_nochirp.yaml
target_mode: phi
# voltage z-scored per time point, end time as a separate input
signal_scaling: time_dependent_zscore

# ARCH - CNN encoder
num_channels: 64             # HPC: 512
num_convs: 2                 # HPC: 6
num_fc_hidden: 1
num_fc_units: 256            # HPC: 2048

# ARCH - velocity field MLP
num_vf_hidden: 2             # HPC: 4
num_vf_units: 256            # HPC: 2048

# TRAIN
batch_size: 32               # HPC: 2048
epochs: 20                   # HPC: 700
lr: 0.0001
models_dir: models_p2d_nochirp_tdzscore
# Path to a checkpoint to restart from (weights only); null = from scratch.
restart_from: null

# FM SPECIFIC
use_prior_matching: false

# TEST
n_samples: 1000
n_ode_steps: 100
