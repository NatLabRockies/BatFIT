# gen_var_dataset.py — chirp FM NPE (ProbProtParamFM)
# gen_var_dataset.py dispatches on the NPE type automatically; here it is the
# frozen chirp FM NPE from 2.npe_fm.

# NPE reference
npe_models_dir: ../2.npe_fm/models_spm_chirp

# DATA (same chirp split the NPE trained on)
cyc_mode: chirp
data_path: ../1.gen_data/data_spm_chirp
n_points: 256                # HPC: 2048
n_prot_params: 3
noise_factor: 1.0
scaler_path: ../1.gen_data/data_spm_chirp/scaler_X.pkl
scaler_P_path: ../1.gen_data/data_spm_chirp/scaler_P.pkl
target_mode: phi

# FM sampling per noisy copy (via model.sample); these override the
# gen_var_dataset.py defaults. HPC omitted them, i.e. used these same defaults.
n_samples: 1000
n_ode_steps: 100

# Dataset generation
gen_batch_size: 64           # HPC: 500
n_noise: 1                   # HPC: 5
# log_sigma: targets become z-scored log(sigma) (StandardScaler saved as
# scaler_logsigma.pkl); mutually exclusive with scale_sigma. Uses a fresh
# var_pred_save_path so no scale_sigma artifacts are mixed in.
scale_sigma: false
log_sigma: true
use_true_y: false
var_pred_save_path: var_pred_data_spm
