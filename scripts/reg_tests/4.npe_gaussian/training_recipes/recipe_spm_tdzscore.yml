# DATA
cyc_mode: discharge
data_path: ../1.gen_data/data_spm_discharge
enforce_licons: false
latent_dim: 128
n_points: 256
noise_factor: 1.0
sim_config: spm_discharge.yaml
target_mode: phi
# voltage z-scored per time point, end time as a separate input
signal_scaling: time_dependent_zscore

# ARCH
# margin of the mu head beyond the [0, 1] parameter bounds
param_margin: 0.05
num_channels: 512
num_convs: 2
num_fc_gamma_mu_hidden: 4
num_fc_gamma_mu_units: 2048
num_fc_hidden: 1
num_fc_units: 2048

# TRAIN
batch_size: 256
epochs: 20
lr: 0.0001
models_dir: models_spm_tdzscore
# Path to a checkpoint to restart from (weights only); empty = train from scratch.
restart_from: null

#SURROGATE
surrogate_model_recipe: ../2.surrogate/training_recipes/recipe_spm.yml
