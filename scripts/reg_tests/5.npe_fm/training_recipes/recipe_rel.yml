# DATA
cyc_mode: discharge
data_path: data_spm_discharge
data_val_path: data_spm_discharge_val
n_param_pred: 6
n_points: 256
noise_factor: 1.0
sim_config: spm_discharge.yaml
target_mode: phi

# ARCH - CNN encoder
num_channels: 128
num_convs: 1
num_fc_hidden: 1
num_fc_units: 256

# ARCH - velocity field MLP
num_vf_hidden: 2
num_vf_units: 128

# TRAIN
batch_size: 256
epochs: 20
lr: 0.001
models_dir: models

# FM SPECIFIC
use_prior_matching: true

# TEST
n_samples: 1000
n_ode_steps: 100

# SURROGATE
surrogate_model_recipe: training_recipes/recipe.yml
