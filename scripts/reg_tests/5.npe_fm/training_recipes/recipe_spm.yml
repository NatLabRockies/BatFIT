# DATA
cyc_mode: discharge
data_path: ../1.gen_data/data_spm_discharge
n_param_pred: 6
n_points: 256
noise_factor: 1.0
sim_config: spm_discharge.yaml
target_mode: phi

# ARCH - CNN encoder
num_channels: 128
num_convs: 1
num_fc_hidden: 1
num_fc_units: 256

# ARCH - velocity field MLP
num_vf_hidden: 2
num_vf_units: 128

# TRAIN
batch_size: 256
epochs: 20
lr: 0.001
models_dir: models_spm
# Path to a checkpoint to restart from (weights only); empty = train from scratch.
restart_from: null

# FM SPECIFIC
use_prior_matching: true

# TEST
n_samples: 1000
n_ode_steps: 100

# SURROGATE
surrogate_model_recipe: ../2.surrogate/training_recipes/recipe_spm.yml
