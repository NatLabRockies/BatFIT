# DATA
cyc_mode: discharge
data_path: ../1.gen_data/data_spm_discharge
n_points: 256
sim_config: spm_discharge.yaml

# ARCH
# margin of the voltage head beyond [vmin, vmax], in volts
voltage_margin: 0.5
fc_units: [1024, 2048, 1024]

# TRAIN
batch_size: 65536
epochs: 200
lr: 0.001
models_dir: spm_discharge_surrogate/models
# Path to a checkpoint to restart from (weights only); empty = train from scratch.
restart_from: null
