# Recipe for train_var_pred.py / test_var_pred.py — FM variant
# NPE-agnostic (operates only on var_pred_dataset.npz); points at the
# FM-generated dataset/model directories so CNN and FM artifacts don't collide.

# DATA
n_param_pred: 6
n_prot_params: 3
sim_config: /Users/mhassana/Desktop/GitHub/BatFIT_chirpslow/batfit/default_exps/spm_chirp.yaml
var_pred_save_path: var_pred_data_fm

# ARCH
hidden_list: [128]

# TRAIN
batch_size: 256
epochs: 500
lr: 0.0001
models_dir: models_fm
