# DATA
cyc_mode: chirp
data_path: data_spm_chirp
n_param_pred: 6
n_prot_params: 3
n_points: 256
noise_factor: 1.0
scaler_path: data_spm_chirp/scaler_X.pkl
scaler_P_path: data_spm_chirp/scaler_P.pkl
sim_config: spm_chirp.yaml
target_mode: phi

# ARCH
